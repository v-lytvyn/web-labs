<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Книгарня</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="container">
        <header>
            <nav>
                <ul>
                    <li><a href="#">Моя Книгарня</a></li>
                    <li><a href="#">Мої Книги</a></li>
                    <li><a href="#" id="create-btn">Додати Книгу</a></li>
                </ul>
                <div class="search-menu">
                    <input type="text" id="search-input" placeholder="Пошук книг...">
                    <button class="search-btn" onclick="searchBooks()">Пошук</button>
                    <button class="clear-btn" onclick="clearSearch()">Очистити</button>
                </div>
            </nav>
        </header>
        <main>
            <aside class="sidebar">
                <h2>Керування книгами</h2>
                <label for="sort">Сортувати за:</label>
                <select id="sort" onchange="sortBooks()">
                    <option value="price">Найвища ціна</option>
                    <option value="pages">Більше сторінок</option>
                    <option value="author">Автор (А–Я)</option>
                </select>
                <button class="count-btn" onclick="calculateTotalPrice()">Підрахувати загальну вартість</button>
                <div class="total-price">
                    <p>Загальна вартість: <span id="total-price">0₴</span></p>
                </div>
            </aside>
            <section class="book-list" id="books"></section>
        </main>
    </div>

    <div id="modal" class="modal">
        <div class="modal-content">
            <span class="close" id="close-modal">&times;</span>
            <h2 id="modal-title">Додати/Редагувати Книгу</h2>
            <form id="book-form">
                <label for="book-title">Назва книги:</label>
                <input type="text" id="book-title" name="book-title" required><br><br>

                <label for="book-author">Автор:</label>
                <input type="text" id="book-author" name="book-author" required><br><br>

                <label for="book-pages">Кількість сторінок:</label>
                <input type="number" id="book-pages" name="book-pages" required><br><br>

                <label for="book-price">Ціна (₴):</label>
                <input type="number" id="book-price" name="book-price" required><br><br>

                <label for="book-image">Посилання на зображення:</label>
                <input type="text" id="book-image" placeholder="Введіть URL зображення"><br>

                <button type="button" onclick="saveBook()">Зберегти</button>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
